services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./services:/app/services
      - ./samples:/app/samples
      - ./tests:/app/tests
      - scan_data:/app/data
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sast_user}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-sast}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      SAST_AI_MAX_FINDINGS: ${SAST_AI_MAX_FINDINGS:-5}
      SAST_CANCEL_PREVIOUS: ${SAST_CANCEL_PREVIOUS:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A services.worker.celery_app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./services:/app/services
      - ./samples:/app/samples
      - ./tests:/app/tests
      - scan_data:/app/data
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sast_user}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-sast}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      SAST_AI_MAX_FINDINGS: ${SAST_AI_MAX_FINDINGS:-5}
      SAST_CANCEL_PREVIOUS: ${SAST_CANCEL_PREVIOUS:-true}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A services.worker.celery_app.celery_app inspect ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sast}
      POSTGRES_USER: ${POSTGRES_USER:-sast_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  dashboard:
    image: nginx:1.27-alpine
    volumes:
      - ./services/dashboard:/usr/share/nginx/html:ro
      - ./services/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  postgres_data:
  redis_data:
  scan_data:
